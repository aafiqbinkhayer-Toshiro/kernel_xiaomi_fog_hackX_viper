name: Setup KSU (one-time)
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  setup:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fog-devel
          fetch-depth: 1

      - name: Integrate KernelSU v0.9.5
        run: |
          if [ -e drivers/kernelsu ]; then
            echo "KSU already integrated"
            exit 0
          fi
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/v0.9.5/kernel/setup.sh" | bash -s v0.9.5
          rm -rf KernelSU/.git
          grep -q '^CONFIG_KSU=y' arch/arm64/configs/vendor/fog-perf_defconfig || \
            echo "CONFIG_KSU=y" >> arch/arm64/configs/vendor/fog-perf_defconfig
          echo "---- check ----"
          grep kernelsu drivers/Makefile drivers/Kconfig
          ls -la drivers/kernelsu

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          git commit -m "Integrate KernelSU v0.9.5"
          git push origin HEAD:fog-devel

      - name: Trigger build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml --ref fog-devel
