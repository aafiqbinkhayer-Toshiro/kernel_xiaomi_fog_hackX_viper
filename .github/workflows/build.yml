name: CI - Fog Kernel
on:
  workflow_dispatch:
  push:
    branches: [fog-devel]
    paths-ignore:
      - '.github/**'
      - '**.md'

concurrency:
  group: fog-build
  cancel-in-progress: true

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: Build
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: https://github.com/aafiqbinkhayer-Toshiro/kernel_xiaomi_fog_hackX_viper
          kernel-branch: fog-devel
          config: vendor/fog-perf_defconfig
          arch: arm64
          aosp-gcc: true
          aosp-clang: true
          android-version: 12
          anykernel3: true
          ksu: true
          ksu-version: v0.9.5
          ksu-lkm: false
